
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HTTPS local (certificado autoassinado para desenvolvimento)
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore/financeia-dev.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=changeit
server.ssl.key-alias=financeia-local
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

