spring.application.name=backend
app.public-base-url=${PUBLIC_BASE_URL:https://tank-straddle-troubling.ngrok-free.dev}
# O ambiente local usa HTTPS na porta 8443. Em produção, defina
# SPRING_PROFILES_ACTIVE=prod e configure SSL_ENABLED conforme o proxy/certificado.
spring.profiles.active=prod
spring.config.import=optional:file:.env[.properties]

# HTTPS local (certificado autoassinado para desenvolvimento)
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore/financeia-dev.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=changeit
server.ssl.key-alias=financeia-local
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# application.properties
spring.jpa.properties.hibernate.default_schema=public
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

spring.rabbitmq.addresses=${RABBITMQ_KEY}
broker.queue.email.name=${NAME_QUEUE}


url.acao=${URL_BRAPI}
token=${TOKEN}

jwt.public.key=classpath:app.pub 
jwt.private.key=classpath:app.key
