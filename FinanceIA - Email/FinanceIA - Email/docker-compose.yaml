services:
  dbEmail:
    image: postgres:16
    container_name: emailDB
    environment:
      POSTGRES_DB: emailDB
      POSTGRES_USER: ${USERNAME_DB}
      POSTGRES_PASSWORD: ${PASSWORD_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: