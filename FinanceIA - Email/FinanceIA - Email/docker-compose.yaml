services:
  dbEmail:
    image: postgres:16
    container_name: emailDB
    environment:
      POSTGRES_DB: emailDB
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: