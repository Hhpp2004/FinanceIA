spring.application.name=financeEmailMs
# Suporta execucao pelo diretorio do modulo e pela pasta que o contem (por exemplo, na IDE).
spring.config.import=optional:file:./.env[.properties],optional:file:./FinanceIA - Email/.env[.properties]

server.port=8444

#Banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5434/emailDB
spring.jpa.properties.hibernate.default_schema=public
spring.datasource.username=${USERNAME_DB}
spring.datasource.password=${PASSWORD_DB}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

#RabbitMQ fila de comunicação
spring.rabbitmq.addresses=${KEY_RABBITMQ}
broker.queue.email.name=${QUEUE_RABBITMQ}

#Sistema Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=henriqueopereira.hp@gmail.com
spring.mail.password=${SENHA_APP}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8
